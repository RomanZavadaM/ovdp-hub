name: Flutter verification and packages
on:
  push:
    branches: [main]
    paths: ['apps/native/**', '.github/workflows/native.yml', 'scripts/package-desktop.ps1']
  pull_request:
    paths: ['apps/native/**', '.github/workflows/native.yml', 'scripts/package-desktop.ps1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: apps/native/build/windows/x64/runner/Release/
          - os: macos-latest
            platform: macos
            artifact: apps/native/build/ovdp-hub-macos.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: flutter build ${{ matrix.platform }} --release
      - name: Package versioned test folder
        id: package
        shell: pwsh
        run: ../../scripts/package-desktop.ps1 -Platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error
