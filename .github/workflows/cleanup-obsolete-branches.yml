name: Cleanup obsolete branches

on:
  push:
    branches:
      - maintenance/cleanup-obsolete-branches

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          current="${GITHUB_REF_NAME}"
          deleted=0
          failed=0
          mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          before="${#branches[@]}"
          echo "Branches before cleanup: $before"
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" || "$branch" == "$current" ]]; then
              continue
            fi
            echo "Deleting $branch"
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"; then
              deleted=$((deleted+1))
            else
              echo "FAILED: $branch" >&2
              failed=$((failed+1))
            fi
          done
          echo "Deleted: $deleted"
          echo "Failed: $failed"
          {
            echo "### OVDP Hub branch cleanup"
            echo "- branches before: $before"
            echo "- deleted obsolete branches: $deleted"
            echo "- failed deletions: $failed"
            echo "- preserved: main"
            echo "- tags/releases are untouched"
          } >> "$GITHUB_STEP_SUMMARY"

          gh issue comment 18 --repo "$GITHUB_REPOSITORY" --body "### 25.09.2026 — repository branch cleanup executed

One-time maintenance cleanup from \`$current\`:
- branches before cleanup: **$before**;
- obsolete non-main branches deleted: **$deleted**;
- failed deletions: **$failed**;
- preserved live development branch: **\`main\`**;
- Git tags, GitHub Releases and commit history were not deleted.

The maintenance branch deletes itself after this comment."

          echo "Deleting maintenance branch $current"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${current}"

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
