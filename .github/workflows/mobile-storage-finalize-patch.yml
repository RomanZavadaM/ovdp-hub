name: Mobile storage finalize patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/mobile-external-storage' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-external-storage
      - name: Apply exact patch
        run: python3 scripts/mobile-storage-finalize-patch.py
      - name: Commit patched source and remove script
        run: |
          rm scripts/mobile-storage-finalize-patch.py
          git config user.name "ovdp-hub-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/native/lib/features/portfolio/portfolio_cubit.dart scripts/mobile-storage-finalize-patch.py
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "Portfolio: require local path for legacy migration"
          git push origin HEAD:feat/mobile-external-storage
