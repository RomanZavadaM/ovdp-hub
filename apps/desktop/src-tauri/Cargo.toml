[package]
name = "ovdp_hub"
version = "0.1.0"
description = "ОВДП Hub desktop client"
authors = ["ОВДП Hub"]
edition = "2021"

[lib]
name = "ovdp_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
