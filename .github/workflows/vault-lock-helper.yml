name: Vault lockfile helper
on:
  push:
    branches: [feat/encrypted-vault-foundation]
    paths: ['apps/native/pubspec.yaml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/encrypted-vault-foundation
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Commit generated lockfile
        working-directory: .
        run: |
          if git diff --quiet -- apps/native/pubspec.lock; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/native/pubspec.lock
          git commit -m "Vault: refresh Flutter lockfile"
          git push origin HEAD:feat/encrypted-vault-foundation
