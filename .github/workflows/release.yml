name: Publish native prerelease

on:
  push:
    branches: [main]
    paths:
      - 'apps/native/pubspec.yaml'
      - 'docs/releases/**'
      - '.github/workflows/release.yml'
      - 'scripts/package-desktop.ps1'
      - 'scripts/package-start.py'
      - 'scripts/verify-desktop-release.ps1'
      - 'LICENSE.md'
      - 'COPYRIGHT.md'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    paths:
      - 'apps/native/pubspec.yaml'
      - 'docs/releases/**'
      - '.github/workflows/release.yml'
      - 'scripts/package-desktop.ps1'
      - 'scripts/package-start.py'
      - 'scripts/verify-desktop-release.ps1'
      - 'LICENSE.md'
      - 'COPYRIGHT.md'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      tag: ${{ steps.meta.outputs.tag }}
      notes: ${{ steps.meta.outputs.notes }}
      exists: ${{ steps.meta.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Resolve release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path

          text = Path('apps/native/pubspec.yaml').read_text(encoding='utf-8-sig')
          match = re.search(r'^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$', text, re.M)
          if not match:
              raise SystemExit('Invalid Flutter version in pubspec.yaml')
          version, build = match.groups()
          tag = f'v{version}'
          notes = f'docs/releases/RELEASE_NOTES_v{version.replace(".", "_")}.md'
          if not Path(notes).is_file():
              raise SystemExit(f'Missing release notes: {notes}')
          exists = subprocess.run(
              ['gh', 'release', 'view', tag, '--repo', os.environ['GITHUB_REPOSITORY']],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          ).returncode == 0
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'version={version}\n')
              out.write(f'build={build}\n')
              out.write(f'tag={tag}\n')
              out.write(f'notes={notes}\n')
              out.write(f'exists={str(exists).lower()}\n')
          print(f'{tag} build {build}; release exists={exists}')
          PY

  verify:
    needs: preflight
    if: github.event_name == 'pull_request' || needs.preflight.outputs.exists != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  start:
    needs: [preflight, verify]
    if: github.event_name != 'pull_request' && needs.preflight.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: package
        name: Prepare START package
        run: python3 scripts/package-start.py
      - name: Create release ZIP
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path

          root = Path('build/start-upload')
          folders = [p for p in root.iterdir() if p.is_dir()]
          if len(folders) != 1:
              raise SystemExit(f'Expected one START root folder, found {len(folders)}')
          release = Path('build/release')
          release.mkdir(parents=True, exist_ok=True)
          target = release / f'OVDP-Hub-{os.environ["VERSION"]}-START'
          shutil.make_archive(str(target), 'zip', root_dir=root, base_dir=folders[0].name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-start
          path: build/release/*.zip
          if-no-files-found: error

  windows:
    needs: [preflight, verify]
    if: github.event_name == 'pull_request' || needs.preflight.outputs.exists != 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release --dart-define=OVDP_APP_VERSION=${{ needs.preflight.outputs.version }} --dart-define=OVDP_APP_BUILD=${{ needs.preflight.outputs.build }}
      - id: package
        name: Package Windows build
        shell: pwsh
        run: ../../scripts/package-desktop.ps1 -Platform windows
      - name: Normalize release asset name
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/release -Force | Out-Null
          Copy-Item -LiteralPath "${{ steps.package.outputs.package_path }}" -Destination "build/release/OVDP-Hub-${{ needs.preflight.outputs.version }}-Windows-x64.zip"
      - name: Smoke-test exact Windows release ZIP
        shell: pwsh
        run: |
          ../../scripts/verify-desktop-release.ps1             -ArchivePath "build/release/OVDP-Hub-${{ needs.preflight.outputs.version }}-Windows-x64.zip"             -Platform windows             -ExpectedVersion "${{ needs.preflight.outputs.version }}"             -ExpectedBuild "${{ needs.preflight.outputs.build }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: apps/native/build/release/*.zip
          if-no-files-found: error

  macos:
    needs: [preflight, verify]
    if: github.event_name == 'pull_request' || needs.preflight.outputs.exists != 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build macos --release --dart-define=OVDP_APP_VERSION=${{ needs.preflight.outputs.version }} --dart-define=OVDP_APP_BUILD=${{ needs.preflight.outputs.build }}
      - id: package
        name: Package macOS build
        shell: pwsh
        run: ../../scripts/package-desktop.ps1 -Platform macos
      - name: Normalize release asset name
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/release -Force | Out-Null
          Copy-Item -LiteralPath "${{ steps.package.outputs.package_path }}" -Destination "build/release/OVDP-Hub-${{ needs.preflight.outputs.version }}-macOS.zip"
      - name: Smoke-test exact macOS release ZIP
        shell: pwsh
        run: |
          ../../scripts/verify-desktop-release.ps1             -ArchivePath "build/release/OVDP-Hub-${{ needs.preflight.outputs.version }}-macOS.zip"             -Platform macos             -ExpectedVersion "${{ needs.preflight.outputs.version }}"             -ExpectedBuild "${{ needs.preflight.outputs.build }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: apps/native/build/release/*.zip
          if-no-files-found: error

  android:
    needs: [preflight, verify]
    if: github.event_name != 'pull_request' && needs.preflight.outputs.exists != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release --dart-define=OVDP_APP_VERSION=${{ needs.preflight.outputs.version }} --dart-define=OVDP_APP_BUILD=${{ needs.preflight.outputs.build }}
      - name: Package Android test build
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          mkdir -p build/android-package
          cp build/app/outputs/flutter-apk/app-release.apk build/android-package/OVDP-Hub.apk
          cp ../../LICENSE.md ../../COPYRIGHT.md ../../THIRD_PARTY_NOTICES.md build/android-package/
          cp ../../docs/LEGAL_AND_COPYRIGHT.md build/android-package/LEGAL_AND_COPYRIGHT.md
          cat > build/android-package/TESTING.txt <<'EOF'
          OVDP Hub Android prerelease.
          This checkpoint uses the current development signing configuration and is not a store release.
          Verify market data and calculations independently before practical use.
          EOF
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          Path('build/release').mkdir(parents=True, exist_ok=True)
          shutil.make_archive(
              f'build/release/OVDP-Hub-{os.environ["VERSION"]}-Android-test',
              'zip',
              root_dir='build',
              base_dir='android-package',
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: apps/native/build/release/*.zip
          if-no-files-found: error

  ios:
    needs: [preflight, verify]
    if: github.event_name != 'pull_request' && needs.preflight.outputs.exists != 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign --dart-define=OVDP_APP_VERSION=${{ needs.preflight.outputs.version }} --dart-define=OVDP_APP_BUILD=${{ needs.preflight.outputs.build }}
      - name: Package unsigned iOS build
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          rm -rf build/ios-package
          mkdir -p build/ios-package
          ditto build/ios/iphoneos/Runner.app build/ios-package/OVDP-Hub.app
          cp ../../LICENSE.md ../../COPYRIGHT.md ../../THIRD_PARTY_NOTICES.md build/ios-package/
          cp ../../docs/LEGAL_AND_COPYRIGHT.md build/ios-package/LEGAL_AND_COPYRIGHT.md
          cat > build/ios-package/TESTING.txt <<'EOF'
          OVDP Hub iOS prerelease.
          This package is unsigned. Installation requires appropriate Apple signing.
          Verify market data and calculations independently before practical use.
          EOF
          mkdir -p build/release
          ditto -c -k --sequesterRsrc --keepParent build/ios-package "build/release/OVDP-Hub-${VERSION}-iOS-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: apps/native/build/release/*.zip
          if-no-files-found: error

  publish:
    needs: [preflight, verify, start, windows, macos, android, ios]
    if: github.event_name != 'pull_request' && needs.preflight.outputs.exists != 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: ${{ needs.preflight.outputs.tag }}
      NOTES: ${{ needs.preflight.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Add legal notices and checksums
        run: |
          cp LICENSE.md COPYRIGHT.md THIRD_PARTY_NOTICES.md dist/
          cp docs/LEGAL_AND_COPYRIGHT.md dist/LEGAL_AND_COPYRIGHT.md
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish immutable prerelease
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OVDP Hub $VERSION" \
            --notes-file "$NOTES" \
            --prerelease
