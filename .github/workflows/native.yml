name: Flutter checks and START
on:
  push:
    branches: [main]
    paths: ['apps/native/**', '.github/workflows/native.yml', 'scripts/package-desktop.ps1', 'scripts/package-start.py', 'LICENSE.md', 'COPYRIGHT.md', 'THIRD_PARTY_NOTICES.md', 'docs/LEGAL_AND_COPYRIGHT.md']
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Compile checkpoint packages (none = START only)'
        type: choice
        default: none
        options: [none, windows, macos, android, ios, all]
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}-${{ github.event_name }}-${{ inputs.packages || 'none' }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Inspect official MinFin PDF geometry (temporary)
        run: dart run tool/inspect_minfin_pdf.dart
      - run: flutter analyze
      - run: flutter test
  source:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare versioned START folder
        id: package
        run: python3 scripts/package-start.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error
          retention-days: 30
  desktop:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["windows","macos","all"]'), inputs.packages)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.packages == 'windows' && '[{"os":"windows-latest","platform":"windows"}]' || inputs.packages == 'macos' && '[{"os":"macos-latest","platform":"macos"}]' || '[{"os":"windows-latest","platform":"windows"},{"os":"macos-latest","platform":"macos"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ${{ matrix.platform }} --release
      - name: Package versioned test folder
        id: package
        shell: pwsh
        run: ../../scripts/package-desktop.ps1 -Platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error
  android:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["android","all"]'), inputs.packages)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release
      - name: Prepare Android test package
        run: |
          mkdir -p build/android-package
          cp build/app/outputs/flutter-apk/app-release.apk build/android-package/OVDP-Hub.apk
          cp ../../LICENSE.md ../../COPYRIGHT.md ../../THIRD_PARTY_NOTICES.md build/android-package/
          cp ../../docs/LEGAL_AND_COPYRIGHT.md build/android-package/LEGAL_AND_COPYRIGHT.md
      - uses: actions/upload-artifact@v4
        with:
          name: OVDP-Hub-Android-test-${{ github.run_number }}-${{ github.run_attempt }}
          path: apps/native/build/android-package/
          if-no-files-found: error
  ios:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["ios","all"]'), inputs.packages)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign
      - name: Prepare iOS test package
        run: |
          rm -rf build/ios-package
          mkdir -p build/ios-package
          ditto build/ios/iphoneos/Runner.app build/ios-package/OVDP-Hub.app
          cp ../../LICENSE.md ../../COPYRIGHT.md ../../THIRD_PARTY_NOTICES.md build/ios-package/
          cp ../../docs/LEGAL_AND_COPYRIGHT.md build/ios-package/LEGAL_AND_COPYRIGHT.md
          ditto -c -k --sequesterRsrc --keepParent build/ios-package build/ovdp-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OVDP-Hub-iOS-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: apps/native/build/ovdp-ios-unsigned.zip
          if-no-files-found: error
