name: Cleanup obsolete branches

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all obsolete non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          deleted=0
          failed=0
          mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          before="${#branches[@]}"
          echo "Branches before cleanup: $before"

          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            echo "Deleting $branch"
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"; then
              deleted=$((deleted+1))
            else
              echo "FAILED: $branch" >&2
              failed=$((failed+1))
            fi
          done

          gh issue comment 18 --repo "$GITHUB_REPOSITORY" --body "### 25.09.2026 — repository branch cleanup executed

One-time post-v0.9.3 cleanup:
- branches before cleanup: **$before**;
- obsolete non-main branches deleted: **$deleted**;
- failed deletions: **$failed**;
- preserved live branch: **\`main\`**;
- Git tags, GitHub Releases and commit history were not deleted.

Next: convert this one-time workflow into a safe manual cleanup + auto-delete-on-merged-PR maintenance workflow."

          {
            echo "### OVDP Hub branch cleanup"
            echo "- branches before: $before"
            echo "- deleted obsolete non-main branches: $deleted"
            echo "- failed deletions: $failed"
            echo "- preserved: main"
            echo "- tags/releases untouched"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
