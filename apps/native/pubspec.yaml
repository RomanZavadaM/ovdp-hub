name: ovdp_hub
description: ОВДП Hub — локальний каталог і сценарії інвестування.
publish_to: none
version: 0.9.0+17
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_selector: ^1.0.3
  path: ^1.9.1
  path_provider: ^2.1.5
  decimal: ^3.2.4
  http: ^1.5.0
  flutter_bloc: ^9.1.1
  archive: ^4.3.0
  # Vault foundation dependencies are security-reviewed and pinned exactly.
  sodium: 4.1.0+1
  flutter_secure_storage: 11.2.0
  win32: 6.4.0
  ffi: 2.2.0
  pdf_document: ^4.5.0
  pdf_graphics: ^4.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/nbu-snapshot.json
