name: One-shot date-control wiring

on:
  push:
    branches: [feat/unified-date-controls]
    paths: ['.github/workflows/date-controls-autopatch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-date-controls
          fetch-depth: 0
      - name: Apply assert-based UI wiring
        run: python3 .github/date_controls_autopatch.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Format changed Dart files
        run: dart format apps/native/lib/ui/date_field.dart apps/native/lib/features/planner/planner_view.dart apps/native/lib/features/portfolio/portfolio_view.dart
      - name: Commit patch and remove one-shot helpers
        shell: bash
        run: |
          git config user.name 'RomanZavadaM'
          git config user.email 'zavada.roman.m@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'UI: wire unified date controls through Planner and Portfolio'
          git push origin HEAD:feat/unified-date-controls
