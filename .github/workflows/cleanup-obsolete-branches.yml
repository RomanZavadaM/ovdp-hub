name: Repository branch hygiene

on:
  workflow_dispatch:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-merged-pr-branch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged PR branch
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.payload.pull_request.head.ref;
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`,
              });
              core.info(`Deleted merged PR branch: ${branch}`);
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.info(`Branch already absent or not deletable: ${branch}`);
              } else {
                throw error;
              }
            }

  manual-cleanup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete all non-main branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            let deleted = 0;
            for (const branch of branches) {
              if (branch.name === 'main') continue;
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch.name}`,
              });
              deleted += 1;
              core.info(`Deleted ${branch.name}`);
            }
            core.info(`Manual cleanup deleted ${deleted} non-main branch(es).`);
